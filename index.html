<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumière du Monde</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; margin: 20px; }
        .section { margin-bottom: 30px; }
        .paywall-banner { background: #f4f4f4; padding: 20px; border-radius: 8px; }
        .btn-pay { display: inline-block; background: #0066cc; color: #fff; padding: 10px 15px; text-decoration: none; border-radius: 4px; }
        .contact-section { background: #fafafa; padding: 20px; border-radius: 8px; }
        input[type="email"], textarea { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; }
        button { background: #28a745; color: #fff; border: none; padding: 12px 20px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="section">
        <p>Les étapes essentielles pour mûrir spirituellement</p>
    </div>

    <!-- Abonnement / Paywall -->
    <section id="abonnement" class="section">
        <div class="paywall-banner">
            <h2>Accédez à l'Intégralité des Enseignements</h2>
            <p>Abonnez-vous pour débloquer l'accès complet</p>
            <a href="#contact" class="btn-pay">S'abonner maintenant</a>
        </div>
    </section>

    <!-- Contact & Formulaire -->
    <section id="contact" class="contact-section section">
        <h2 class="section-title">Poser une Question ou Contacter l'Auteur</h2>
        <p style="margin-bottom: 1.5rem;">Avez-vous une question ou un besoin de prière ?</p>

        <form action="https://formspree.io/f/mzezeebb" method="POST">
            <!-- Redirection vers la page de remerciement après l'envoi -->
            <input type="hidden" name="_next" value="merci.html">

            <label for="email">Votre email :</label>
            <input type="email" id="email" name="email" placeholder="Votre email" required>

            <label for="message">Votre message :</label>
            <textarea id="message" name="message" placeholder="Votre message" rows="5" required></textarea>

            <button type="submit">Envoyer</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Lumière du Monde. Tous droits réservés.</p>
    </footer>

</body>
</html>
